# Builds the Runpod render image (cloud/Dockerfile) and pushes it to GitHub's container registry.
name: render image
on:
  push:
    paths: [cloud/Dockerfile, blender/fetch_assets.py, .github/workflows/render-image.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: cloud/Dockerfile
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/nicolescheid/whiskedaway-render:5.1.0
            ghcr.io/nicolescheid/whiskedaway-render:sha-${{ github.sha }}
