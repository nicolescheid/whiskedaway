<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
<title id="title">WhiskedAway hallway layout — facing sea</title><desc id="desc">Four room doors, two per side, with dials on the front-door side. Cuddlecore is back left, Flourish back right, Sweet Spells front left and Chiapothecary front right. Stairs and cellar are on the left of the entrance hall, notice board to right of hallway opening.</desc>
<style>text{font-family:system-ui,sans-serif;fill:#2c2416}.room{fill:#fbf8f1;stroke:#5e4a34;stroke-width:3}.hall{fill:#e7dbc5;stroke:#5e4a34;stroke-width:3}.dial{fill:#b07f52;stroke:#573e25;stroke-width:1}.name{font-size:22px;font-weight:600}.small{font-size:14px}.label{font-size:16px}</style>
<rect width="900" height="760" fill="#f4efe4"/><text x="450" y="35" text-anchor="middle" class="name">The hallway: layout authority</text><text x="450" y="62" text-anchor="middle" class="small">Facing the sea · hill side left · garden side right</text>
<rect x="180" y="90" width="540" height="64" fill="#c9d6d8"/><text x="450" y="127" text-anchor="middle" class="label">Sea · tall rear sash window</text>
