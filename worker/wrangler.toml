name = "whiskedaway-genie"
main = "whiskedaway-worker.js"
account_id = "413cb81347f3e89932f12e3ed9a6d062" # Nicole's Cloudflare account; never deploy elsewhere
compatibility_date = "2024-01-01"

# Worker logs (the guard, the navigator's usage, and measure:"pass" lines from /m) can be read in the dashboard under Observability
[observability]
enabled = true

# You'll need to add your API key as a secret:
# wrangler secret put ANTHROPIC_API_KEY

# Bot guard (see the bottom of whiskedaway-worker.js).
# Secrets, set with `wrangler secret put`: TURNSTILE_SECRET_KEY, PASS_SECRET, GA_API_SECRET (analytics)
[vars]
BOT_GUARD = "enforce"   # "log" records would-be blocks without blocking (use while rolling out frontend changes)
# Google Analytics web stream for whiskedaway.com (public). The Measurement Protocol secret is a
# secret: wrangler secret put GA_API_SECRET. Without both, POST /m counts nothing.
GA_MEASUREMENT_ID = "G-PBDF79MT72"
# Cost control (20 Oct 2026, API spend limit hit): the navigator runs on Haiku; write-outs stay on Sonnet.
NAVIGATOR_MODEL = "claude-haiku-5-5"
ALLOWED_ORIGINS = "https://whiskedaway.com,https://www.whiskedaway.com,http://localhost:5173,http://localhost:5174,http://localhost:4173"

# The write-out cache (writeout-cache.js, 23 Oct 2026): Inn recipes by a hash of their options, 30 days; and per-day write-out
# counts per hashed visitor pass (logged only, groundwork for the golden book's caps). Created with `wrangler kv namespace create`
[[kv_namespaces]]
binding = "WRITEOUT_CACHE"
id = "218043ca87074acca6f864df74ed1ccc"

# Per visitor pass: 6 recipes and 30 navigation steps a minute is far more than a person needs
# Re-writes of a recipe already written (a swap, other measurements): /rewrite. The page caps them at 5 a day per device
[[ratelimits]]
name = "REWRITE_LIMIT"
namespace_id = "4207"
  [ratelimits.simple]
  limit = 3
  period = 60

[[ratelimits]]
name = "RECIPE_LIMIT"
namespace_id = "4201"
  [ratelimits.simple]
  limit = 6
  period = 60

[[ratelimits]]
name = "NAVIGATE_LIMIT"
namespace_id = "4202"
  [ratelimits.simple]
  limit = 6
  period = 60

# Per IP backstop across paid routes, generous enough for a shared household or office
[[ratelimits]]
name = "IP_LIMIT"
namespace_id = "4203"
  [ratelimits.simple]
  limit = 60
  period = 60

# Turnstile exchanges per IP
[[ratelimits]]
name = "SESSION_LIMIT"
namespace_id = "4204"
  [ratelimits.simple]
  limit = 10
  period = 60

# Ceiling on paid calls per minute per Cloudflare location, whoever is calling
[[ratelimits]]
name = "GLOBAL_LIMIT"
namespace_id = "4205"
  [ratelimits.simple]
  limit = 120
  period = 60

# Analytics events (POST /m) per visitor pass. The page batches, so a person sends a few a minute
[[ratelimits]]
name = "MEASURE_LIMIT"
namespace_id = "4206"
  [ratelimits.simple]
  limit = 60
  period = 60
