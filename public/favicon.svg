<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="swirlGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c4956a" />
      <stop offset="100%" style="stop-color:#e8b87a" />
    </linearGradient>
  </defs>
  
  <!-- Rising swirl -->
  <path d="M14 22 
           Q10 18, 10 13 
           Q10 7, 16 6
           Q22 5, 25 10"
        fill="none" 
        stroke="url(#swirlGrad)" 
        stroke-width="2.5" 
        stroke-linecap="round"/>
  
  <!-- Sparkle at top -->
  <circle cx="25" cy="10" r="2" fill="#e8b87a"/>
  <circle cx="18" cy="5" r="1" fill="#c4956a" opacity="0.7"/>
  
  <!-- Simple whisk -->
  <line x1="16" y1="30" x2="15" y2="22" 
        stroke="#2c2416" 
        stroke-width="2.5" 
        stroke-linecap="round"/>
  <ellipse cx="14" cy="18" rx="5" ry="6" 
           fill="none" 
           stroke="#2c2416" 
           stroke-width="2"/>
</svg>
